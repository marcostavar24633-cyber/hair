name: HAIR STUDIO — quality & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hair-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static and cross-browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock playwright axe-core

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run static quality checks
        run: node tests/site-check.cjs

      - name: Run Chromium browser checks
        run: BROWSER=chromium node tests/browser-check.cjs

      - name: Run Firefox browser checks
        run: BROWSER=firefox node tests/browser-check.cjs

      - name: Run WebKit browser checks
        run: BROWSER=webkit node tests/browser-check.cjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hair-studio-browser-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7


  performance-audit:
    name: Lighthouse performance report
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Lighthouse and Chromium
        run: |
          npm install --no-save --no-package-lock lighthouse playwright
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/hair-static-server.log 2>&1 &
          echo $! >/tmp/hair-static-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hair-static-server.log
          exit 1

      - name: Run Lighthouse mobile audit
        run: |
          mkdir -p artifacts
          CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npx lighthouse http://127.0.0.1:4173/ \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html \
            --output-path=artifacts/lighthouse-mobile --quiet

      - name: Run Lighthouse desktop audit
        run: |
          CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npx lighthouse http://127.0.0.1:4173/ \
            --preset=desktop \
            --chrome-path="$CHROME_PATH" \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output=html \
            --output-path=artifacts/lighthouse-desktop --quiet

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hair-studio-lighthouse
          path: artifacts/lighthouse-*
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build GitHub Pages artifact
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
