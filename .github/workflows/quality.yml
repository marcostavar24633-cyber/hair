name: HAIR STUDIO — quality & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  quality:
    name: Static and cross-browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test-only dependencies
        run: npm install --no-save --no-package-lock playwright axe-core

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run static quality checks
        run: node tests/site-check.cjs

      - name: Run Chromium browser checks
        run: BROWSER=chromium node tests/browser-check.cjs

      - name: Run Firefox browser checks
        run: BROWSER=firefox node tests/browser-check.cjs

      - name: Run WebKit browser checks
        run: BROWSER=webkit node tests/browser-check.cjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hair-studio-browser-qa
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build GitHub Pages artifact
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
